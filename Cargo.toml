[package]
name         = "mentci-lib"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/mentci-lib"
description  = "mentci-lib — the client observability + control model for the mentci programmable-UI component. Owns the MVU-shaped ObservationModel keyed by component socket, the approval state machine over signal-mentci's vocabulary, the edits-as-proposals flow, the NOTA-fallback renderer, and the typed closed-decision -> criome verdict mapping."

[dependencies]
signal-mentci      = { git = "https://github.com/LiGoldragon/signal-mentci", branch = "main" }
signal-frame       = { git = "https://github.com/LiGoldragon/signal-frame", branch = "main", default-features = false }
meta-signal-mentci = { git = "https://github.com/LiGoldragon/meta-signal-mentci", branch = "main" }
signal-criome      = { git = "https://github.com/LiGoldragon/signal-criome", branch = "main" }
meta-signal-criome = { git = "https://github.com/LiGoldragon/meta-signal-criome", branch = "main" }
# The universal-client second component: introspect's working signal. mentci-lib
# queries the introspect daemon's ComponentTrace operation through this contract,
# proving the client talks to more than its own triad's signal-mentci.
signal-introspect  = { git = "https://github.com/LiGoldragon/signal-introspect", branch = "trace-introspect-slice" }
# EngineIdentifier (the introspect query's engine filter) is owned by
# signal-persona; signal-introspect re-imports it privately, so the client
# depends on signal-persona for the typed identifier rather than mirroring it.
signal-persona     = { git = "https://github.com/LiGoldragon/signal-persona", branch = "main" }
nota-next          = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
thiserror          = "2"

[features]
default     = []
# NOTA projection of typed payloads (the render-typed-replies-and-unknown-
# objects behavior). Pulls the optional NOTA codec through every contract.
nota-text = [
  "dep:nota-next",
  "signal-frame/nota-text",
  "signal-mentci/nota-text",
  "meta-signal-mentci/nota-text",
  "signal-criome/nota-text",
  "meta-signal-criome/nota-text",
  "signal-introspect/nota-text",
  "signal-persona/nota-text",
]

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
