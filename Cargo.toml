[package]
name         = "mentci-lib"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/mentci-lib"
description  = "mentci-lib — the shared observability + control model for the mentci programmable-UI component. Owns the MVU-shaped ObservationModel keyed by component socket, the approval state machine over signal-mentci's vocabulary, the edits-as-proposals flow, the NOTA-fallback renderer, and the closed-decision -> criome verdict mapping. Consumed by the mentci daemon and by thin clients (mentci-egui first)."

[dependencies]
signal-mentci      = { git = "https://github.com/LiGoldragon/signal-mentci", branch = "main" }
signal-frame       = { git = "https://github.com/LiGoldragon/signal-frame", branch = "main", default-features = false }
meta-signal-mentci = { git = "https://github.com/LiGoldragon/meta-signal-mentci", branch = "main" }
signal-criome      = { git = "https://github.com/LiGoldragon/signal-criome", branch = "main" }
meta-signal-criome = { git = "https://github.com/LiGoldragon/meta-signal-criome", branch = "main" }
nota-next          = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
thiserror          = "2"

[features]
default     = []
# NOTA projection of typed payloads (the render-typed-replies-and-unknown-
# objects behavior). Pulls the optional NOTA codec through every contract.
nota-text = [
  "dep:nota-next",
  "signal-frame/nota-text",
  "signal-mentci/nota-text",
  "meta-signal-mentci/nota-text",
  "signal-criome/nota-text",
  "meta-signal-criome/nota-text",
]

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

# Designer prototype: consume the local signal-mentci epic branch (the
# CriomeEscalation-carries-the-slot seam) before operator integrates it to
# main. Collapses to the plain git dep once the branch lands on main.
[patch."https://github.com/LiGoldragon/signal-mentci"]
signal-mentci = { path = "/home/li/wt/github.com/LiGoldragon/signal-mentci/re-found-on-live-contracts" }
